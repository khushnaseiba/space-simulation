[package]
name = "space-simulation"
version = "0.1.0"
edition = "2024"
description = "Space simulation that runs in the browser"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3.107"
features = ['CanvasRenderingContext2d', 'Document', 'Element', 'Event', 'EventTarget', 'HtmlCanvasElement', 'MouseEvent', 'Window', "Performance"]
